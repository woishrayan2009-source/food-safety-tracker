<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Food Safety Tracker logo</title>
  <desc>A shield shape in teal containing a white fork and a green checkmark badge, representing food safety verification.</desc>

  <!-- Shield -->
  <path d="M120 18
           L196 46
           V112
           C196 165 165 202 120 222
           C75 202 44 165 44 112
           V46
           Z"
        fill="#0F766E" />

  <!-- Inner shield outline for depth -->
  <path d="M120 34
           L182 57
           V112
           C182 156 156 186 120 204
           C84 186 58 156 58 112
           V57
           Z"
        fill="none" stroke="#5EEAD4" stroke-width="2" opacity="0.55" />

  <!-- Fork -->
  <g fill="#FFFFFF">
    <rect x="99" y="70" width="6" height="52" rx="3" />
    <rect x="112" y="70" width="6" height="34" rx="3" />
    <rect x="125" y="70" width="6" height="52" rx="3" />
    <path d="M96 100 C96 112 108 118 112 118 C116 118 128 112 128 100
             L128 92 L96 92 Z" />
    <rect x="109" y="118" width="6" height="46" rx="3" />
  </g>

  <!-- Checkmark badge -->
  <circle cx="150" cy="150" r="30" fill="#22C55E" stroke="#0F766E" stroke-width="4" />
  <path d="M137 150 L146 159 L164 139" fill="none" stroke="#FFFFFF"
        stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
