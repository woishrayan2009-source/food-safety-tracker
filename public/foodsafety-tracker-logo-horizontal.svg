<svg width="360" height="80" viewBox="0 0 360 80" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Food Safety Tracker horizontal logo, light-on-dark</title>
  <desc>Shield icon with fork and checkmark, followed by the wordmark Food Safety Tracker, in light colors for use on a dark header background.</desc>

  <!-- Shield, scaled down -->
  <g transform="translate(4,4) scale(0.3)">
    <path d="M120 18 L196 46 V112 C196 165 165 202 120 222 C75 202 44 165 44 112 V46 Z"
          fill="#5EEAD4" />
    <path d="M120 34 L182 57 V112 C182 156 156 186 120 204 C84 186 58 156 58 112 V57 Z"
          fill="none" stroke="#FAF9F4" stroke-width="2" opacity="0.5" />
    <g fill="#18170F">
      <rect x="99" y="70" width="6" height="52" rx="3" />
      <rect x="112" y="70" width="6" height="34" rx="3" />
      <rect x="125" y="70" width="6" height="52" rx="3" />
      <path d="M96 100 C96 112 108 118 112 118 C116 118 128 112 128 100 L128 92 L96 92 Z" />
      <rect x="109" y="118" width="6" height="46" rx="3" />
    </g>
    <circle cx="150" cy="150" r="30" fill="#86EFAC" stroke="#18170F" stroke-width="4" />
    <path d="M137 150 L146 159 L164 139" fill="none" stroke="#18170F"
          stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Wordmark, light for dark backgrounds -->
  <text x="82" y="38" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FAF9F4">Food Safety</text>
  <text x="82" y="62" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#C9D6C3">Tracker</text>
</svg>
